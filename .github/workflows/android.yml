name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 9.3.1
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 9.3.1

      # ═══════════════════════════════════════════════════════
      # 1) إنشاء .env من الـ secrets
      # ═══════════════════════════════════════════════════════
      - name: Create .env file
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env
          echo "✅ .env created"

      # ═══════════════════════════════════════════════════════
      # 2) فحص .env قبل البناء
      # ═══════════════════════════════════════════════════════
      - name: 🔍 Verify .env before build
        run: |
          echo "════════════════════════════════════════════"
          echo "   فحص ملف .env قبل البناء"
          echo "════════════════════════════════════════════"
          if [ ! -f .env ]; then
            echo "❌ .env غير موجود"
            exit 1
          fi

          while IFS='=' read -r key value; do
            [ -z "$key" ] && continue
            [[ "$key" == \#* ]] && continue
            if [ -z "$value" ]; then
              echo "❌ $key = (فارغ / لم يتم تعيينه)"
            else
              echo "✅ $key = معيّن (الطول: ${#value} حرف، البداية: ${value:0:6}...)"
            fi
          done < .env

      # ═══════════════════════════════════════════════════════
      # 3) البناء
      # ═══════════════════════════════════════════════════════
      - name: Build Release APK
        run: gradle assembleRelease

      # ═══════════════════════════════════════════════════════
      # 4) فحص المصادر المولّدة (BuildConfig + secrets.xml)
      # ═══════════════════════════════════════════════════════
      - name: 🔍 Verify generated sources
        run: |
          echo "════════════════════════════════════════════"
          echo "   فحص المصادر المولّدة بواسطة Secrets Plugin"
          echo "════════════════════════════════════════════"

          SECRETS_XML=$(find . -name "secrets.xml" -path "*generated*" 2>/dev/null | head -1)
          BUILD_CONFIG=$(find . -name "BuildConfig.java" -path "*generated*" 2>/dev/null | head -1)

          echo ""
          echo "── secrets.xml ──"
          if [ -n "$SECRETS_XML" ]; then
            echo "📄 المسار: $SECRETS_XML"
            if grep -q 'name="DATABASE_URL"' "$SECRETS_XML"; then
              echo "✅ DATABASE_URL موجود في secrets.xml"
              # استخراج القيمة للتحقق من طولها فقط (بدون طباعتها)
              VALUE=$(grep -oP '(?<=name="DATABASE_URL"[^>]*>)[^<]*' "$SECRETS_XML" || true)
              echo "   الطول: ${#VALUE} حرف"
            else
              echo "❌ DATABASE_URL غير موجود في secrets.xml"
            fi
          else
            echo "❌ secrets.xml لم يتم توليده"
          fi

          echo ""
          echo "── BuildConfig.java ──"
          if [ -n "$BUILD_CONFIG" ]; then
            echo "📄 المسار: $BUILD_CONFIG"
            if grep -q 'DATABASE_URL' "$BUILD_CONFIG"; then
              echo "✅ DATABASE_URL موجود في BuildConfig"
            else
              echo "❌ DATABASE_URL غير موجود في BuildConfig"
            fi
          else
            echo "❌ BuildConfig.java لم يتم توليده"
          fi

      # ═══════════════════════════════════════════════════════
      # 5) فحص محتوى الـ APK النهائي
      # ═══════════════════════════════════════════════════════
      - name: 🔍 Verify inside final APK
        run: |
          echo "════════════════════════════════════════════"
          echo "   فحص محتوى APK النهائي"
          echo "════════════════════════════════════════════"

          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "❌ لم يتم العثور على APK"
            exit 1
          fi
          echo "📦 APK: $APK ($(du -h "$APK" | cut -f1))"
          echo ""

          mkdir -p /tmp/apk_content
          unzip -o "$APK" -d /tmp/apk_content > /dev/null

          # فحص dex
          echo "── فحص classes.dex ──"
          if strings /tmp/apk_content/classes*.dex 2>/dev/null | grep -q "DATABASE_URL"; then
            echo "✅ DATABASE_URL موجود في dex"
          else
            echo "⚠️ DATABASE_URL غير موجود في dex (قد يكون R8 حذفه أو لم يُستخدم)"
          fi

          # فحص resources
          echo ""
          echo "── فحص resources.arsc ──"
          if command -v aapt2 >/dev/null 2>&1; then
            if aapt2 dump resources /tmp/apk_content/resources.arsc 2>/dev/null | grep -q "DATABASE_URL"; then
              echo "✅ DATABASE_URL موجود في resources"
            else
              echo "⚠️ DATABASE_URL غير موجود في resources"
            fi
          else
            if strings /tmp/apk_content/resources.arsc 2>/dev/null | grep -q "DATABASE_URL"; then
              echo "✅ DATABASE_URL موجود في resources.arsc"
            else
              echo "⚠️ DATABASE_URL غير موجود في resources.arsc"
            fi
          fi

      # ═══════════════════════════════════════════════════════
      # 6) ملخص نهائي
      # ═══════════════════════════════════════════════════════
      - name: 📊 Summary
        if: always()
        run: |
          echo "════════════════════════════════════════════"
          echo "   ملخص التحقق من DATABASE_URL"
          echo "════════════════════════════════════════════"
          echo ""
          echo "| المرحلة              | الحالة |"
          echo "|----------------------|--------|"

          # .env
          if [ -f .env ] && grep -q "^DATABASE_URL=.\+" .env; then
            echo "| .env                 | ✅     |"
          else
            echo "| .env                 | ❌     |"
          fi

          # secrets.xml
          SX=$(find . -name "secrets.xml" -path "*generated*" 2>/dev/null | head -1)
          if [ -n "$SX" ] && grep -q 'name="DATABASE_URL"' "$SX"; then
            echo "| secrets.xml          | ✅     |"
          else
            echo "| secrets.xml          | ❌     |"
          fi

          # BuildConfig
          BC=$(find . -name "BuildConfig.java" -path "*generated*" 2>/dev/null | head -1)
          if [ -n "$BC" ] && grep -q 'DATABASE_URL' "$BC"; then
            echo "| BuildConfig          | ✅     |"
          else
            echo "| BuildConfig          | ❌     |"
          fi

          # APK
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -n "$APK" ]; then
            mkdir -p /tmp/apk_final
            unzip -o "$APK" -d /tmp/apk_final > /dev/null 2>&1
            if strings /tmp/apk_final/classes*.dex 2>/dev/null | grep -q "DATABASE_URL"; then
              echo "| APK (dex)            | ✅     |"
            else
              echo "| APK (dex)            | ⚠️     |"
            fi
            if strings /tmp/apk_final/resources.arsc 2>/dev/null | grep -q "DATABASE_URL"; then
              echo "| APK (resources)      | ✅     |"
            else
              echo "| APK (resources)      | ⚠️     |"
            fi
          fi

      # ═══════════════════════════════════════════════════════
      # 7) رفع الـ APK
      # ═══════════════════════════════════════════════════════
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
